<svg width="1920" height="80" viewBox="0 0 1920 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Red diagonal stripes pattern -->
  <defs>
    <pattern id="stripes" patternUnits="userSpaceOnUse" width="40" height="40" patternTransform="rotate(-45)">
      <rect width="20" height="40" fill="#EC3750"/>
      <rect x="20" width="20" height="40" fill="#FF6B81"/>
    </pattern>
  </defs>
  
  <!-- Main striped background -->
  <rect width="1920" height="80" fill="url(#stripes)"/>
  
  <!-- White decorative lines -->
  <line x1="0" y1="20" x2="1920" y2="20" stroke="white" stroke-width="3" opacity="0.4"/>
  <line x1="0" y1="60" x2="1920" y2="60" stroke="white" stroke-width="3" opacity="0.4"/>
  
  <!-- Stars/dots decoration -->
  <circle cx="150" cy="40" r="4" fill="white" opacity="0.6"/>
  <circle cx="450" cy="40" r="4" fill="white" opacity="0.6"/>
  <circle cx="750" cy="40" r="4" fill="white" opacity="0.6"/>
  <circle cx="1050" cy="40" r="4" fill="white" opacity="0.6"/>
  <circle cx="1350" cy="40" r="4" fill="white" opacity="0.6"/>
  <circle cx="1650" cy="40" r="4" fill="white" opacity="0.6"/>
  
  <!-- Main text -->
  <text x="960" y="52" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="white" text-anchor="middle" letter-spacing="4">BUILD. BREAK. LEARN.</text>
</svg>
